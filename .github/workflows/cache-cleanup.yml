name: Cache Cleanup

# PR 生命周期管理：当 PR 合并或关闭时，自动清除该 PR 独占的分支编译缓存与 AI 审查会话工件。

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: 清理已关闭 PR 缓存与会话
    runs-on: ubuntu-latest
    steps:
      - name: 删除当前 PR 命名空间下的所有缓存与会话工件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 1. 删除当前 PR 的分支独占编译缓存
          gh cache delete --all --ref "refs/pull/${PR_NUMBER}/merge" 2>/dev/null || true
          # 2. 物理销毁当前 PR 的 AI 审查会话工件
          gh api --paginate "repos/${GH_REPO}/actions/artifacts" \
            --jq ".artifacts[] | select(.name == \"pi-session-pr-${PR_NUMBER}\") | .id" \
            | xargs -r -I{} gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/{}"
