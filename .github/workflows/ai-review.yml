name: AI Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup Review Session
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 物理销毁已关闭 PR 的审查会话工件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/${GH_REPO}/actions/artifacts" \
            --jq ".artifacts[] | select(.name == \"pi-session-pr-${PR_NUMBER}\") | .id" \
            | xargs -r -n 1 gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/{}"

  review:
    name: AI Review
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed' && !github.event.pull_request.draft && github.event.pull_request.head.repo.fork != true) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@timi-ai review') &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR')
      ) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: 解析 PR 编号与审查模式
        id: setup
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_PULL: ${{ github.event.pull_request.number }}
          PR_NUMBER_ISSUE: ${{ github.event.issue.number }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_NUM="$PR_NUMBER_PULL"
            IS_CONT="true"
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            PR_NUM="$PR_NUMBER_ISSUE"
            if echo "$COMMENT_BODY" | grep -iE "@timi-ai\s+review\s+(-c|--continue)" > /dev/null; then
              IS_CONT="true"
            else
              IS_CONT="false"
            fi
          else
            PR_NUM="$PR_NUMBER_INPUT"
            IS_CONT="true"
          fi
          echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "incremental=${IS_CONT}" >> "$GITHUB_OUTPUT"

      - name: 检出可信主干审查规范
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: 发送占位评论
        id: comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.setup.outputs.pr_number }}
        run: |
          COMMENT_ID=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -X POST -f body="Timi AI 审查中。。。" --jq '.id')
          echo "comment_id=${COMMENT_ID}" >> "$GITHUB_OUTPUT"

      - name: 下载历史会话工件
        if: steps.setup.outputs.incremental == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.setup.outputs.pr_number }}
        run: |
          mkdir -p "$RUNNER_TEMP/pi-session"
          ARTIFACT_ID=$(gh api "repos/${GH_REPO}/actions/artifacts?name=pi-session-pr-${PR_NUMBER}" --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/session.zip"
            unzip -q -o "$RUNNER_TEMP/session.zip" -d "$RUNNER_TEMP/pi-session/"
          fi

      - name: 安装 Bun 与 pi
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: 安装 pi 与 review 扩展
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          bun install -g @earendil-works/pi-coding-agent
          pi install git:github.com/earendil-works/pi-review

      - name: 写入 pi 认证
        env:
          PI_AUTH_JSON: ${{ secrets.PI_AUTH_JSON }}
        run: |
          mkdir -p "$RUNNER_TEMP/pi-agent"
          printf '%s' "$PI_AUTH_JSON" > "$RUNNER_TEMP/pi-agent/auth.json"
          chmod 600 "$RUNNER_TEMP/pi-agent/auth.json"

      - name: 抓取当前 PR Diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.setup.outputs.pr_number }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$GH_REPO" > "$RUNNER_TEMP/pr.diff"

      - name: 运行 AI 审查
        id: review
        env:
          PI_SESSION_DIR: ${{ runner.temp }}/pi-session
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
          PR_NUMBER: ${{ steps.setup.outputs.pr_number }}
          INCREMENTAL: ${{ steps.setup.outputs.incremental }}
        run: |
          if [ "$INCREMENTAL" = "false" ]; then
            rm -rf "$PI_SESSION_DIR"
            mkdir -p "$PI_SESSION_DIR"
          fi

          pi --session-id "pr-${PR_NUMBER}" \
             --approve \
             -p \
             @REVIEW_GUIDELINES.md \
             @"$RUNNER_TEMP/pr.diff" \
             "这是 PR #${PR_NUMBER} 的最新代码变更。请严格根据 REVIEW_GUIDELINES.md 审查代码，并输出纯 Markdown 格式的专业审查报告，不要包含任何口语或表情符号。" > "$RUNNER_TEMP/review_report.md"

      - name: 原地更新审查评论
        if: always() && steps.comment.outputs.comment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ steps.comment.outputs.comment_id }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          if [ "$REVIEW_OUTCOME" = "success" ] && [ -s "$RUNNER_TEMP/review_report.md" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" -F "body=@${RUNNER_TEMP}/review_report.md"
          else
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" -f body="Timi AI 审查未完成，请检查 Actions 日志排查详情。"
          fi

      - name: 保存会话工件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: pi-session-pr-${{ steps.setup.outputs.pr_number }}
          path: ${{ runner.temp }}/pi-session/
          retention-days: 15
          overwrite: true
