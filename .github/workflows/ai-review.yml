name: AI Review

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true
        type: string

concurrency:
  group: ai-review-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Timi Reviewer
    runs-on: ubuntu-latest
    if: >-
      vars.AI_REVIEW_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.issue.pull_request != null &&
          contains(github.event.comment.body, '@timi-ai') &&
          (github.event.comment.author_association == 'OWNER' ||
           github.event.comment.author_association == 'MEMBER' ||
           github.event.comment.author_association == 'COLLABORATOR')
        )
      )
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number || inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: 恢复受信任的审查脚本
        run: git checkout origin/main -- scripts/ai-review.ts

      - name: 获取 Timi AI Bot 凭据
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TIMI_AI_APP_ID }}
          private-key: ${{ secrets.TIMI_AI_PRIVATE_KEY }}

      - name: 安装 Bun 运行时
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: 安装依赖
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          bun install -g @earendil-works/pi-coding-agent
          pi install git:github.com/earendil-works/pi-review

      - name: 写入认证
        env:
          PI_AUTH_JSON: ${{ secrets.PI_AUTH_JSON }}
        run: |
          mkdir -p "$RUNNER_TEMP/pi-agent"
          printf '%s' "$PI_AUTH_JSON" > "$RUNNER_TEMP/pi-agent/auth.json"
          chmod 600 "$RUNNER_TEMP/pi-agent/auth.json"

      - name: 运行审查
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: bun run scripts/ai-review.ts

      - name: 保存会话工件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pi-session-pr-${{ github.event.issue.number || inputs.pr_number }}
          path: ${{ runner.temp }}/pi-session/
          retention-days: 15
          overwrite: true
