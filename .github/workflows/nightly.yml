name: Nightly

on:
  # 每周跑一次变异测试；变异数 × 测试时长开销大，不适合放 PR 门禁
  schedule:
    - cron: "30 1 * * 6" # UTC 周六 01:30 ≈ 北京时间 09:30
  workflow_dispatch:

# 手动触发与定时运行不叠加执行
concurrency:
  group: mutation-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation-test:
    name: 变异测试
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master（工具链版本由 rust-toolchain.toml 控制）
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-mutants
      - run: cargo mutants --all-features --in-place
      # 无论结果如何都上传报告，失败时下载 mutants.out 排查漏网之鱼
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-report
          path: mutants.out*
          retention-days: 14
