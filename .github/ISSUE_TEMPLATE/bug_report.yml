name: Bug Report
description: Report a reproducible bug or defect in the codebase.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in the details below to help us investigate.
  - type: input
    id: component
    attributes:
      label: Affected Component
      description: Specify the affected crate or subsystem (e.g., core, cli, web, ci).
      placeholder: "e.g., core / cli / web"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps or code snippet to reproduce the issue.
      placeholder: |
        1. Run command '...'
        2. Provide input '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Rust version, OS, browser, or runtime version.
      placeholder: |
        * OS: macOS / Linux / Windows
        * Rust version: 1.98.0
        * Bun version: 1.4.0
    validations:
      required: false
